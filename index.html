<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkod Tarayıcı</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Barkod Tarayıcı</h1>
        
        <div class="input-section">
            <label for="customerName">Müşteri Adı:</label>
            <input type="text" id="customerName" placeholder="Müşteri adınızı girin">
        </div>

        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <div class="scan-overlay"></div>
        </div>

        <div class="status-section">
            <p id="status">Kamera başlatılıyor...</p>
        </div>

        <div class="barcode-list">
            <h2>Taranan Barkodlar</h2>
            <ul id="barcodes"></ul>
        </div>

        <button id="sendButton" disabled>Bitir ve Gönder</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
